<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Debug Products</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:monospace;padding:20px}#log{background:#111;color:#0f0;padding:20px;white-space:pre-wrap;font-size:13px;max-height:80vh;overflow:auto}</style>
</head><body>
<h2>Product Debug - Step by Step</h2>
<div id="dynamic-product-sections"></div>
<div id="log"></div>
<script>
function log(msg, ok=true) {
  document.getElementById('log').innerHTML += `<span style="color:${ok?'#0f0':'#f44'}">${ok?'✅':'❌'} ${msg}</span>\n`;
}

document.addEventListener('DOMContentLoaded', async () => {
  log('DOMContentLoaded fired');
  
  // Step 1: Check supabase library
  if (typeof supabase === 'undefined') { log('supabase library NOT loaded', false); return; }
  log('supabase library loaded');

  // Step 2: Create client  
  const SUPABASE_URL = 'https://gvuzsbrplmgqjuchjcpk.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2dXpzYnJwbG1ncWp1Y2hqY3BrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTE5NDMsImV4cCI6MjA5MTI4Nzk0M30.PowRUwVvHnEKvfBC3jvK5gHUsCACT2ecTJxOAat8qXU';
  
  let _supabase;
  try {
    _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    log('Supabase client created');
  } catch(e) { log('createClient failed: ' + e.message, false); return; }

  // Step 3: Query products
  log('Querying products...');
  try {
    const { data: products, error } = await _supabase
      .from('products')
      .select('id,name,category,price,stock_quantity,rating,notes,origin,process,variants,image_icon');
    
    if (error) { log('Query error: ' + error.message, false); return; }
    log(`Fetched ${products.length} products`);
    
    // Step 4: Show categories
    const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
    log('Categories: ' + cats.join(', '));

    // Step 5: Render products
    const container = document.getElementById('dynamic-product-sections');
    cats.forEach(cat => {
      const catId = cat.replace(/\s+/g, '-').toLowerCase();
      const section = document.createElement('div');
      section.style.marginBottom = '20px';
      section.innerHTML = `<h3 style="color:#333">${cat}</h3>`;
      const grid = document.createElement('div');
      grid.id = 'grid-' + catId;
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px';
      section.appendChild(grid);
      container.appendChild(section);
    });

    products.forEach(p => {
      if (!p.category) return;
      const catId = 'grid-' + p.category.replace(/\s+/g, '-').toLowerCase();
      const grid = document.getElementById(catId);
      if (grid) {
        const card = document.createElement('div');
        card.style.cssText = 'border:1px solid #ccc;padding:10px;border-radius:8px';
        card.innerHTML = `<strong>${p.name}</strong><br>Rp ${(p.price||0).toLocaleString('id-ID')}<br><small>${p.notes||''}</small>`;
        grid.appendChild(card);
      }
    });
    log(`Rendered ${products.length} products into DOM`);
    
  } catch(e) {
    log('Exception: ' + e.message + '\n' + e.stack, false);
  }
});
</script>
</body></html>
